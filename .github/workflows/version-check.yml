name: Version Check

on:
  push:
    tags: ['v*']

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify version header matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Expected version: $VERSION"

          if ! grep -qF "$VERSION" "src/VERSION"; then
            echo "::error file=src/main.opy::Version header does not contain $VERSION"
            exit 1
          fi

          echo "Version header matches tag ✓"