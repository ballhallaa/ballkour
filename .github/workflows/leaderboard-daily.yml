# Once a day, the leaderboard bot from develop (.github/workflows/leaderboard-bot.yml there): it posts any board that
# changed and gives out the roles, so people who joined the Discord server since get theirs. GitHub only runs
# scheduled workflows from the default branch, which is main, so the schedule lives here and not on develop.
name: Leaderboard bot (daily)

on:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  post:
    uses: ballhallaa/ballkour/.github/workflows/leaderboard-bot.yml@develop
    secrets: inherit
