# Posts a leaderboard to its Discord channel whenever it changes on develop, then saves the board to
# leaderboards/history.json. Run it by hand (Actions → Leaderboard bot → Run workflow) for a dry run that
# only draws the pictures, or to post a course's newest board again.
name: Leaderboard bot

on:
  push:
    branches: [develop]
    paths:
      - "leaderboards/**"
      - "!leaderboards/history.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: draw the pictures but don't post or save anything"
        type: boolean
        default: true
      course:
        description: "Post this course's newest board again (course number, optional)"
        type: string
        required: false

# One run at a time, so two quick updates can't post the same board twice
concurrency:
  group: leaderboard-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install fonts for Chinese/Japanese names and flags
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji

      - name: Install the bot
        working-directory: tools/leaderboard-bot
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Post changed leaderboards
        working-directory: tools/leaderboard-bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_COURSE: ${{ inputs.course }}
        run: node bot.mjs

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-pictures
          path: |
            tools/leaderboard-bot/out/*.png
            tools/leaderboard-bot/out/*.txt
          if-no-files-found: ignore

      - name: Save posted boards to history.json
        if: ${{ always() && !inputs.dry_run && hashFiles('tools/leaderboard-bot/out/commit-message.txt') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboards/history.json
          git commit -F tools/leaderboard-bot/out/commit-message.txt
          git pull --rebase origin develop
          git push origin HEAD:develop
