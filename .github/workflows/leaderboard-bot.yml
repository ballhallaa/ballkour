# Posts a leaderboard to its Discord channel whenever it changes, then saves the board to leaderboards/history.json.
# A board changes with its course's file here on develop, or with leaderboards/runs.json (the runs sent from the
# website) on the leaderboard-data branch, whose own workflow calls this one. history.json is on that branch too, so the
# commits for every run stay off develop. Run it by hand (Actions → Leaderboard bot → Run workflow) for a dry run that
# only draws the pictures, or to post courses' newest boards again (an empty top 10 for a course with no runs).
# Each course's assisted board (runs played in Assist Mode) goes to the course's own assistedChannel in courses.json,
# and is saved under "assisted" in history.json. A course without one has its assisted board posted once it gets one.
#   gh workflow run leaderboard-bot.yml --ref develop -f dry_run=false -f course=3-12
# With legacy, it posts the boards from before May 2026 to each course's legacy channel instead (course picks which):
#   gh workflow run leaderboard-bot.yml --ref develop -f dry_run=false -f legacy=true
# With no_congrats, boards go out without the "Congrats …" line, so nobody is pinged again for a board they're already on:
#   gh workflow run leaderboard-bot.yml --ref develop -f dry_run=false -f course=all -f no_congrats=true
# With not_new, the pictures have no NEW chip or green border on new runs (add no_congrats to also skip the pings):
#   gh workflow run leaderboard-bot.yml --ref develop -f dry_run=false -f course=all -f no_congrats=true -f not_new=true
# With boards, it only posts the unassisted boards, or only the assisted ones:
#   gh workflow run leaderboard-bot.yml --ref develop -f dry_run=false -f course=all -f no_congrats=true -f boards=unassisted
# After posting, it gives every rated player their rating role on Discord, Top 0.1% (Unassisted) … Top 90% (Unassisted)
# or Rated (Unassisted), the same with (Assisted) for the assisted rating and (Legacy) for the Legacy rating, Top-10 Run
# and Former Top-10 Run, Top-10 Rating and Former Top-10 Rating (Unassisted, Assisted and Global), Legacy Top-10
# Rating, and the ratings heading over them (roles.mjs). It also runs once a day, from
# .github/workflows/leaderboard-daily.yml on main: GitHub only runs scheduled workflows from the default branch, so a
# schedule here would never start.
# With reset_top10, the Top-10 roles are also taken from everyone who shouldn't have them, given by hand or not (once,
# after the Top-10 roles changed in November 2026):
#   gh workflow run leaderboard-bot.yml --ref develop -f dry_run=true -f reset_top10=true
name: Leaderboard bot

on:
  push:
    branches: [develop]
    paths:
      - "leaderboards/**"
  # From .github/workflows/leaderboard-new-runs.yml on the leaderboard-data branch, when runs.json or history.json
  # changes there, and from .github/workflows/leaderboard-daily.yml on main, once a day
  workflow_call:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: draw the pictures but don't post or save anything"
        type: boolean
        default: true
      course:
        description: "Post these courses' newest boards again: 3, 3,5,7, 3-12 or all (optional)"
        type: string
        required: false
      legacy:
        description: "Post the legacy boards (before May 2026) to the legacy channels instead"
        type: boolean
        default: false
      no_congrats:
        description: "Leave out the \"Congrats …\" line, so nobody is pinged"
        type: boolean
        default: false
      not_new:
        description: "Draw the pictures without the NEW chip and green border on new runs"
        type: boolean
        default: false
      boards:
        description: "Which boards to post: both, only the unassisted ones, or only the assisted ones"
        type: choice
        options: [both, unassisted, assisted]
        default: both
      reset_top10:
        description: "Take the Top-10 roles from everyone who shouldn't have them, given by hand or not"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    # Pinned: ubuntu-latest is moving to Ubuntu 26, which this Playwright version's browser setup doesn't know yet
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # room for the fonts and Chromium to retry through a mirror or GitHub outage
    # One run at a time, so two quick updates can't post the same board twice. On the job, not the workflow, so it
    # holds for runs called from the leaderboard-data branch too.
    concurrency:
      group: leaderboard-bot
      cancel-in-progress: false
    env:
      DATA_ROOT: ${{ github.workspace }}/leaderboard-data
    steps:
      # Both branches as they are now, not the commit that started the run: runs sent from the website can land while
      # another run is posting, and this way each run sees the boards the one before it posted, so nobody is
      # congratulated twice. (The daily run would start on the default branch, main, otherwise.)
      - uses: actions/checkout@v5
        with:
          ref: develop

      - name: Check out the runs and the posted boards
        uses: actions/checkout@v5
        with:
          ref: leaderboard-data
          path: leaderboard-data

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false # the bot has no lockfile to cache by

      # The fonts the fonts-noto-cjk and fonts-noto-color-emoji packages install, downloaded from Noto's own releases
      # and kept in the cache, so the runner's Ubuntu mirror being down can't stop the boards. Saved to the cache as soon
      # as they're downloaded, even if the run then fails.
      - name: Restore the fonts for Chinese/Japanese names and flags
        id: fonts
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/share/fonts/noto
          key: fonts-noto-cjk-Sans2.004-emoji-v2.051

      - name: Download the fonts for Chinese/Japanese names and flags
        if: steps.fonts.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/fonts/noto
          cd ~/.local/share/fonts/noto
          # Keeps trying for up to 5 minutes, through GitHub hiccups too
          get() { curl -fsSL --connect-timeout 10 --max-time 120 --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 -O "$1"; }
          get https://github.com/notofonts/noto-cjk/raw/Sans2.004/Sans/OTC/NotoSansCJK-Regular.ttc
          get https://github.com/notofonts/noto-cjk/raw/Sans2.004/Sans/OTC/NotoSansCJK-Bold.ttc
          get https://github.com/googlefonts/noto-emoji/raw/v2.051/fonts/NotoColorEmoji.ttf
          sha256sum -c <<'EOF'
          b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  NotoSansCJK-Regular.ttc
          faa5f3656a78b2e2d450d27fe8382c778bc2b6bb5ea29c986664a6a435056ceb  NotoSansCJK-Bold.ttc
          72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  NotoColorEmoji.ttf
          EOF

      - name: Save the fonts for Chinese/Japanese names and flags
        if: steps.fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.local/share/fonts/noto
          key: ${{ steps.fonts.outputs.cache-primary-key }}

      - name: Install the fonts
        run: fc-cache -f && fc-list | grep -E "NotoSansCJK-(Regular|Bold)|NotoColorEmoji" | sort

      # The packages Playwright apt-installs for Chromium that the runner doesn't have: all fonts (fonts-wqy-zenhei,
      # fonts-tlwg-loma-otf, fonts-unifont, …), for names in scripts the other fonts don't cover. Downloaded as these
      # exact files from kernel.org's Ubuntu mirror (or Ubuntu's own) instead of with apt, whose Azure mirror is
      # sometimes unreachable for hours, and saved to the cache as soon as they're downloaded, even if the run then fails.
      # Change the key's v2 when changing the list.
      - name: Restore Chromium's fonts
        id: chromium-debs
        uses: actions/cache/restore@v6
        with:
          path: ~/chromium-debs
          key: chromium-debs-ubuntu-24.04-v2

      - name: Download Chromium's fonts
        if: steps.chromium-debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/chromium-debs
          cd ~/chromium-debs
          # Tries kernel.org's mirror, then Ubuntu's own, for up to 5 minutes
          get() {
            until curl -fsSL --connect-timeout 10 --max-time 120 -O "https://mirrors.edge.kernel.org/ubuntu/pool/$1" ||
                  curl -fsSL --connect-timeout 10 --max-time 120 -O "http://archive.ubuntu.com/ubuntu/pool/$1"; do
              if [ "$SECONDS" -ge 300 ]; then
                echo "Still failing after 5 minutes, giving up"
                return 1
              fi
              echo "Failed, trying again in 10 s"
              sleep 10
            done
          }
          get universe/f/fonts-ipafont/fonts-ipafont-gothic_00303-21ubuntu1_all.deb
          get main/f/fonts-freefont/fonts-freefont-ttf_20211204+svn4273-2_all.deb
          get universe/f/fonts-tlwg/fonts-tlwg-loma-otf_0.7.3-1_all.deb
          get universe/u/unifont/fonts-unifont_15.1.01-1build1_all.deb
          get universe/f/fonts-wqy-zenhei/fonts-wqy-zenhei_0.9.45-8_all.deb
          get universe/x/xfonts-cyrillic/xfonts-cyrillic_1.0.5+nmu1_all.deb
          get main/x/xfonts-scalable/xfonts-scalable_1.0.3-1.3_all.deb
          get main/x/xfonts-utils/xfonts-utils_7.7+6build3_amd64.deb
          get main/x/xfonts-encodings/xfonts-encodings_1.0.5-0ubuntu2_all.deb
          # The checksums in Ubuntu 24.04's package lists
          sha256sum -c <<'EOF'
          71e63f0f88cca672fbb24ed27873d799d8c37233f001aa0bbcdc2f303b1b98a2  fonts-ipafont-gothic_00303-21ubuntu1_all.deb
          c8283ec9ca390e6ad8d2114cb0942182db62bb97f5142c2f955218fc5f2027b4  fonts-freefont-ttf_20211204+svn4273-2_all.deb
          888038637a15d11993e3a9ddd50f6391a704918b2e38fe75b2f4d74b4fcfda9a  fonts-tlwg-loma-otf_0.7.3-1_all.deb
          56c9d46ce8223fa29c28eaeb99cabfc3a3159d3eec58f0bbbea839953f4cf363  fonts-unifont_15.1.01-1build1_all.deb
          496969d65dc5664a3291e678d5cbef6815dc308ee5bf37b656c00af2cb490410  fonts-wqy-zenhei_0.9.45-8_all.deb
          d4a63d4da9f6d58467ccaa22b7b26c009ab46b07f0b1be2138d3bb037e74d2cb  xfonts-cyrillic_1.0.5+nmu1_all.deb
          517f73a4f6e37332addffe6ff1795d5371f2f9c0863781efc31c4613f69993de  xfonts-scalable_1.0.3-1.3_all.deb
          8da5fccbc50005d50dd69ef558ae72673435026e1d3134d0c1cc836d22953c44  xfonts-utils_7.7+6build3_amd64.deb
          3bac5ff1cba3b001aee1652e3af45d200c415b68e9b27932cb51fe9c464feb40  xfonts-encodings_1.0.5-0ubuntu2_all.deb
          EOF

      - name: Save Chromium's fonts
        if: steps.chromium-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/chromium-debs
          key: ${{ steps.chromium-debs.outputs.cache-primary-key }}

      # Chromium itself, from Playwright's download server, kept in the cache for the same reason
      - name: Restore Chromium
        id: chromium
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-ubuntu-24.04-${{ hashFiles('tools/leaderboard-bot/package.json') }}

      - name: Install the bot
        working-directory: tools/leaderboard-bot
        run: |
          shopt -s nullglob
          # Keeps trying for up to 10 minutes, for the runner's Ubuntu mirror or Playwright's server being down
          retry() {
            until "$@"; do
              if [ "$SECONDS" -ge 600 ]; then
                echo "Still failing after 10 minutes, giving up"
                return 1
              fi
              echo "Failed, trying again in 30 s"
              sleep 30
            done
          }
          npm install --no-audit --no-fund
          sudo dpkg -i --skip-same-version ~/chromium-debs/*.deb
          retry npx playwright install chromium
          # The runner already has every library Chromium needs. If it ever doesn't, Playwright apt-installs them.
          missing=$(ldd ~/.cache/ms-playwright/chromium{,_headless_shell}-*/chrome-linux/{chrome,headless_shell} | grep "not found" || true)
          if [ -n "$missing" ]; then
            echo "Chromium is missing libraries:"
            echo "$missing"
            retry npx playwright install-deps chromium
          fi

      - name: Save Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium.outputs.cache-primary-key }}

      - name: Post changed leaderboards
        working-directory: tools/leaderboard-bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_COURSE: ${{ inputs.course }}
          LEGACY: ${{ inputs.legacy && '1' || '' }}
          NO_CONGRATS: ${{ inputs.no_congrats && '1' || '' }}
          NOT_NEW: ${{ inputs.not_new && '1' || '' }}
          BOARDS: ${{ inputs.boards }}
        run: node bot.mjs

      # One rating role per rated player (Top 0.1% … Top 90%, or Rated), even when no board changed. Not for legacy boards.
      - name: Give out the rating roles
        if: ${{ !cancelled() && !inputs.legacy }}
        working-directory: tools/leaderboard-bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          RESET_TOP10: ${{ inputs.reset_top10 && '1' || '' }}
        run: node roles.mjs

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: leaderboard-pictures
          path: |
            tools/leaderboard-bot/out/*.png
            tools/leaderboard-bot/out/*.txt
          if-no-files-found: ignore

      # Pushed with the workflow's own token, so it doesn't start another run
      - name: Save posted boards to history.json
        if: ${{ always() && !inputs.dry_run && hashFiles('tools/leaderboard-bot/out/commit-message.txt') != '' }}
        working-directory: leaderboard-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboards/history.json
          git commit -F ../tools/leaderboard-bot/out/commit-message.txt
          git pull --rebase origin leaderboard-data
          git push origin HEAD:leaderboard-data
