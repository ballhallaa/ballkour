# Posts a leaderboard to its Discord channel whenever it changes, then saves the board to leaderboards/history.json.
# A board changes with its course's file here on develop, or with leaderboards/runs.json (the runs sent from the
# website) on the leaderboard-data branch, whose own workflow calls this one. history.json is on that branch too, so the
# commits for every run stay off develop. Run it by hand (Actions → Leaderboard bot → Run workflow) for a dry run that
# only draws the pictures, or to post courses' newest boards again (an empty top 10 for a course with no runs).
# Each course's assisted board (runs played in Assist Mode) goes to the course's own assistedChannel in courses.json,
# and is saved under "assisted" in history.json. A course without one has its assisted board posted once it gets one.
#   gh workflow run leaderboard-bot.yml --ref develop -f dry_run=false -f course=3-12
# With legacy, it posts the boards from before May 2026 to each course's legacy channel instead (course picks which):
#   gh workflow run leaderboard-bot.yml --ref develop -f dry_run=false -f legacy=true
# With no_congrats, boards go out without the "Congrats …" line, so nobody is pinged again for a board they're already on:
#   gh workflow run leaderboard-bot.yml --ref develop -f dry_run=false -f course=all -f no_congrats=true
# With not_new, the pictures have no NEW chip or green border on new runs (add no_congrats to also skip the pings):
#   gh workflow run leaderboard-bot.yml --ref develop -f dry_run=false -f course=all -f no_congrats=true -f not_new=true
# With boards, it only posts the unassisted boards, or only the assisted ones:
#   gh workflow run leaderboard-bot.yml --ref develop -f dry_run=false -f course=all -f no_congrats=true -f boards=unassisted
# After posting, it gives every rated player their rating role on Discord, Top 0.1% (Unassisted) … Top 90% (Unassisted)
# or Rated (Unassisted), the same with (Assisted) for the assisted rating and (Legacy) for the Legacy rating, and Top 10, Former Top 10, Top 10 (Assisted), Former Top 10 (Assisted),
# Legacy Top 10, and the ratings heading over them (roles.mjs). It also runs once a day, from .github/workflows/leaderboard-daily.yml on
# main: GitHub only runs scheduled workflows from the default branch, so a schedule here would never start.
name: Leaderboard bot

on:
  push:
    branches: [develop]
    paths:
      - "leaderboards/**"
  # From .github/workflows/leaderboard-data.yml on the leaderboard-data branch, when runs.json or history.json changes
  # there, and from .github/workflows/leaderboard-daily.yml on main, once a day
  workflow_call:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: draw the pictures but don't post or save anything"
        type: boolean
        default: true
      course:
        description: "Post these courses' newest boards again: 3, 3,5,7, 3-12 or all (optional)"
        type: string
        required: false
      legacy:
        description: "Post the legacy boards (before May 2026) to the legacy channels instead"
        type: boolean
        default: false
      no_congrats:
        description: "Leave out the \"Congrats …\" line, so nobody is pinged"
        type: boolean
        default: false
      not_new:
        description: "Draw the pictures without the NEW chip and green border on new runs"
        type: boolean
        default: false
      boards:
        description: "Which boards to post: both, only the unassisted ones, or only the assisted ones"
        type: choice
        options: [both, unassisted, assisted]
        default: both

permissions:
  contents: write

jobs:
  post:
    # Pinned: ubuntu-latest is moving to Ubuntu 26, which this Playwright version's browser setup doesn't know yet
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # room for the fonts and Chromium to retry through a mirror or GitHub outage
    # One run at a time, so two quick updates can't post the same board twice. On the job, not the workflow, so it
    # holds for runs called from the leaderboard-data branch too.
    concurrency:
      group: leaderboard-bot
      cancel-in-progress: false
    env:
      DATA_ROOT: ${{ github.workspace }}/leaderboard-data
    steps:
      # Both branches as they are now, not the commit that started the run: runs sent from the website can land while
      # another run is posting, and this way each run sees the boards the one before it posted, so nobody is
      # congratulated twice. (The daily run would start on the default branch, main, otherwise.)
      - uses: actions/checkout@v5
        with:
          ref: develop

      - name: Check out the runs and the posted boards
        uses: actions/checkout@v5
        with:
          ref: leaderboard-data
          path: leaderboard-data

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false # the bot has no lockfile to cache by

      # The fonts the fonts-noto-cjk and fonts-noto-color-emoji packages install, downloaded from Noto's own releases
      # and kept in the cache, so the runner's Ubuntu mirror being down can't stop the boards
      - name: Restore the fonts for Chinese/Japanese names and flags
        id: fonts
        uses: actions/cache@v6
        with:
          path: ~/.local/share/fonts/noto
          key: fonts-noto-cjk-Sans2.004-emoji-v2.051

      - name: Download the fonts for Chinese/Japanese names and flags
        if: steps.fonts.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/fonts/noto
          cd ~/.local/share/fonts/noto
          # Keeps trying for up to 5 minutes, through GitHub hiccups too
          get() { curl -fsSL --connect-timeout 10 --max-time 120 --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 -O "$1"; }
          get https://github.com/notofonts/noto-cjk/raw/Sans2.004/Sans/OTC/NotoSansCJK-Regular.ttc
          get https://github.com/notofonts/noto-cjk/raw/Sans2.004/Sans/OTC/NotoSansCJK-Bold.ttc
          get https://github.com/googlefonts/noto-emoji/raw/v2.051/fonts/NotoColorEmoji.ttf
          sha256sum -c <<'EOF'
          b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  NotoSansCJK-Regular.ttc
          faa5f3656a78b2e2d450d27fe8382c778bc2b6bb5ea29c986664a6a435056ceb  NotoSansCJK-Bold.ttc
          72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  NotoColorEmoji.ttf
          EOF

      - name: Install the fonts
        run: fc-cache -f && fc-list | grep -E "NotoSansCJK-(Regular|Bold)|NotoColorEmoji" | sort

      - name: Install the bot
        working-directory: tools/leaderboard-bot
        run: |
          npm install --no-audit --no-fund
          # Playwright apt-installs Chromium's system libraries, and the runner's Ubuntu mirror is sometimes unreachable
          # for a few minutes, so keep trying for up to 10 minutes
          until npx playwright install --with-deps chromium; do
            if [ "$SECONDS" -ge 600 ]; then
              echo "Couldn't install Chromium for 10 minutes, giving up"
              exit 1
            fi
            echo "Couldn't install Chromium, trying again in 30 s"
            sleep 30
          done

      - name: Post changed leaderboards
        working-directory: tools/leaderboard-bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_COURSE: ${{ inputs.course }}
          LEGACY: ${{ inputs.legacy && '1' || '' }}
          NO_CONGRATS: ${{ inputs.no_congrats && '1' || '' }}
          NOT_NEW: ${{ inputs.not_new && '1' || '' }}
          BOARDS: ${{ inputs.boards }}
        run: node bot.mjs

      # One rating role per rated player (Top 0.1% … Top 90%, or Rated), even when no board changed. Not for legacy boards.
      - name: Give out the rating roles
        if: ${{ !cancelled() && !inputs.legacy }}
        working-directory: tools/leaderboard-bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node roles.mjs

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: leaderboard-pictures
          path: |
            tools/leaderboard-bot/out/*.png
            tools/leaderboard-bot/out/*.txt
          if-no-files-found: ignore

      # Pushed with the workflow's own token, so it doesn't start another run
      - name: Save posted boards to history.json
        if: ${{ always() && !inputs.dry_run && hashFiles('tools/leaderboard-bot/out/commit-message.txt') != '' }}
        working-directory: leaderboard-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboards/history.json
          git commit -F ../tools/leaderboard-bot/out/commit-message.txt
          git pull --rebase origin leaderboard-data
          git push origin HEAD:leaderboard-data
